<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .h { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .t { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #283247; }
      .small { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4a5568; }
      .formula { font: 16px "Cambria Math", "Times New Roman", serif; fill: #172033; }
      .box { fill: #ffffff; stroke: #2c5282; stroke-width: 2; rx: 12; }
      .prior { fill: #fffaf0; stroke: #c05621; stroke-width: 2; rx: 12; }
      .loss { fill: #f0fff4; stroke: #2f855a; stroke-width: 2; rx: 12; }
      .arrow { stroke: #2d3748; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #718096; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2d3748" />
    </marker>
  </defs>

  <rect width="980" height="520" fill="#f7fafc"/>
  <text x="40" y="48" class="title">正则化的 MAP 视角</text>
  <text x="40" y="78" class="small">MLE 只相信数据；MAP 在相信数据的同时加入对参数的先验信念。</text>

  <rect x="55" y="125" width="240" height="125" class="box"/>
  <text x="80" y="160" class="h">MLE</text>
  <text x="80" y="192" class="formula">θ_MLE = argmax p(y|X,θ)</text>
  <text x="80" y="222" class="small">只最大化似然</text>

  <rect x="370" y="105" width="260" height="165" class="prior"/>
  <text x="395" y="140" class="h">MAP</text>
  <text x="395" y="172" class="formula">θ_MAP = argmax p(y|X,θ)p(θ)</text>
  <text x="395" y="205" class="small">似然 × 先验</text>
  <text x="395" y="235" class="small">等价于：NLL + 正则项</text>

  <rect x="710" y="70" width="220" height="145" class="loss"/>
  <text x="735" y="105" class="h">Gaussian prior</text>
  <text x="735" y="137" class="formula">θ ~ N(0, η²I)</text>
  <text x="735" y="169" class="small">推出 L2 正则化</text>
  <text x="735" y="196" class="formula">λ||θ||²₂</text>

  <rect x="710" y="285" width="220" height="145" class="loss"/>
  <text x="735" y="320" class="h">Laplace prior</text>
  <text x="735" y="352" class="formula">θ_j ~ Laplace(0,b)</text>
  <text x="735" y="384" class="small">推出 L1 正则化</text>
  <text x="735" y="411" class="formula">γ||θ||₁</text>

  <path d="M295 188 C325 188, 335 188, 370 188" class="arrow"/>
  <path d="M630 160 C660 145, 675 135, 710 132" class="arrow"/>
  <path d="M630 220 C665 265, 675 335, 710 355" class="arrow"/>

  <rect x="55" y="325" width="575" height="120" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.5" rx="12"/>
  <text x="80" y="360" class="h">直觉</text>
  <text x="80" y="392" class="t">先验越强，越不允许参数随便变大。</text>
  <text x="80" y="422" class="t">L2 倾向于让参数整体变小；L1 更容易把部分参数压到 0。</text>
</svg>
